name: Deploy

# Deploys after CI passes on a push: staging to Railway's test environment,
# main to production. Each environment has its own project token, so neither
# can touch the other. Until the secrets and the service name exist, this
# reports that it skipped and succeeds.
#
# Needs, in the repo's settings:
#   secret   RAILWAY_TOKEN_TEST         project token for the test environment
#   secret   RAILWAY_TOKEN_PRODUCTION   project token for the production environment
#   variable RAILWAY_SERVICE            the HQ service's name in Railway

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.workflow_run.head_branch }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'test' }}
    env:
      TARGET: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'test' }}
      RAILWAY_TOKEN: ${{ github.event.workflow_run.head_branch == 'main' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_TEST }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - name: Check the deploy is set up
        id: ready
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "Skipped: the Railway token for $TARGET or the RAILWAY_SERVICE variable is not set yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
      - name: Deploy the commit CI tested
        if: steps.ready.outputs.ready == 'true'
        run: npx --yes @railway/cli@5.71.1 up --ci --service "$RAILWAY_SERVICE" --environment "$TARGET"
