name: Release

# Runs when staging is merged into main. Tags the version in package.json and
# publishes a GitHub release whose notes are that version's CHANGELOG section.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to do."
            exit 0
          fi
          node tools/release/notes.mjs "$version" > release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
